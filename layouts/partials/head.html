<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ .Title }}</title>
{{ $desc := .Description | default site.Params.description }}
<meta name="description" content="{{ $desc }}">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="alternate" hreflang="pt-BR" href="{{ .Permalink }}">
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="{{ site.Title }}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="{{ "fonts/inter-var-latin.woff2" | absURL }}" as="font" type="font/woff2" crossorigin>
{{ $css := resources.Get "css/main.css" | minify }}
<style>{{ $css.Content | safeCSS }}</style>
{{ partial "jsonld.html" . }}
