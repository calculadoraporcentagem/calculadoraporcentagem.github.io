name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - master        # trigger saat push ke branch master
  workflow_dispatch:  # bisa dijalankan manual dari tab Actions

# Izin untuk menulis ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya izinkan satu deployment berjalan sekaligus
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default shell
defaults:
  run:
    shell: bash

jobs:
  # ── Job 1: Build ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.9   # ganti jika ingin versi lain
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # ambil theme sebagai submodule jika ada
          fetch-depth: 0          # dibutuhkan jika enableGitInfo = true

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          # https://gohugo.io/troubleshooting/build-performance/#hugo-env
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Sao_Paulo   # timezone sesuai target audiens (Brasil)
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ── Job 2: Deploy ────────────────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
